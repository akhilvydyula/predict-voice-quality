name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in VocalIQ.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: The pitch meter freezes after stopping a session...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /session
        2. Tap Start
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (Chrome)
        - Web (Firefox)
        - Web (Safari)
        - iOS (Expo Go)
        - Android (Expo Go)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: main @ abc1234 or 1.0.0

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: logs
    attributes:
      label: Console logs or screenshots
      description: Paste errors from browser devtools or Expo terminal.
