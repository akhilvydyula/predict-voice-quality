name: Feature request
description: Suggest an idea for VocalIQ
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your idea for VocalIQ. Search existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Practice / live session
        - Analytics / progress
        - Coach / plans
        - Tools (tuner, metronome, etc.)
        - Landing / marketing
        - API / backend
        - Docs / open source
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this feature
          required: false
